name = "phpoc-staging"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# R2 bucket binding — the opaque byte store for all phpoc data.
# Swap R2 ↔ S3 ↔ Backblaze B2 by changing only this binding and
# the Worker code that talks to it (not the Python transport).
[[r2_buckets]]
binding = "PHPOC_BUCKET"
bucket_name = "phpoc-data"

# Environment variables (not secrets — these are less sensitive)
[vars]
API_KEY_ENV = "PHPOC_API_KEY"

# Secrets (set via `npx wrangler secret put PHPOC_API_KEY`)
# The Worker reads the API key from secrets, not from env vars.
