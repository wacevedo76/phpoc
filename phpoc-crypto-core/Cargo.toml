[package]
name = "phpoc-crypto-core"
version = "0.1.0"
edition = "2021"
description = "Portable crypto library for PH Ledger — compiled to WASM, .a, and .so"
license = "MIT"
repository = "https://github.com/wacevedo76/phpoc"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "phpoc_crypto_core"

[dependencies]
# Core crypto
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

# AES-128-CTR (ring doesn't expose raw CTR mode)
aes = "0.8"
ctr = "0.9"

# Encoding
hex = "0.4"
base64 = "0.22"

# JSON for blob obfuscation and test vectors
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM interop
wasm-bindgen = { version = "0.2", optional = true }

# Random for WASM (required by ring's wasm feature)
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["std"]
std = []
wasm = ["wasm-bindgen", "ring/wasm32_unknown_unknown_js"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"

[profile.release]
opt-level = "z"      # Optimize for size (important for WASM)
lto = true           # Link-time optimization
codegen-units = 1    # Slower compile, smaller output
