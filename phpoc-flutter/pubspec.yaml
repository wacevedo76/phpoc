name: phpoc_flutter
description: "PH Ledger — personal history protocol, Flutter mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.9.0
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # File picker
  file_picker: ^11.0.2

  # Biometric authentication
  local_auth: ^2.3.0

  # HTTP
  http: ^1.2.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  pointycastle: ^4.0.0
  crypto: ^3.0.7

  # Crypto FFI
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  freezed: ^2.5.0
  json_serializable: ^6.9.0
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
